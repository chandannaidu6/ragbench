<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ragbench runs one chunker-retriever combination inside an isolated subprocess: it loads and chunks the corpus, resolves the embedder and LLM client through a provider factory, retrieves and evaluates each query, then returns a RunResult over stdout so a native-library crash inside the subprocess can never take down the caller.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>

  <!-- Entry points -->
  <rect x="60" y="24" width="230" height="54" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="175" y="46" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#1e1b4b">CLI</text>
  <text x="175" y="63" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#1e1b4b">ragbench run / compare</text>

  <rect x="330" y="24" width="230" height="54" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="445" y="46" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#1e1b4b">Python API</text>
  <text x="445" y="63" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#1e1b4b">ragbench.run() / .compare()</text>

  <!-- converge to Config -->
  <line x1="175" y1="78" x2="345" y2="140" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="78" x2="405" y2="140" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="245" y="140" width="320" height="56" rx="8" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
  <text x="405" y="163" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#111827">RunConfig / MatrixConfig</text>
  <text x="405" y="180" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">corpus + chunker + retriever + providers</text>

  <!-- boundary crossing arrow -->
  <line x1="405" y1="196" x2="405" y2="238" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="420" y="222" font-family="Segoe UI, Arial" font-size="11" fill="#b91c1c">config.model_dump_json() via stdin</text>

  <!-- subprocess boundary -->
  <rect x="40" y="238" width="1120" height="380" rx="10" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="262" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#b91c1c">isolated subprocess (evaluation._isolated_worker) — a native-library segfault (chromadb / torch / onnxruntime) in here cannot kill the caller</text>

  <!-- Load + Chunk -->
  <rect x="80" y="300" width="190" height="70" rx="8" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
  <text x="175" y="326" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#111827">Load + Chunk</text>
  <text x="175" y="343" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">pdf(s) or pre-chunked json</text>
  <text x="175" y="358" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">fixed_size / recursive / semantic</text>
  <text x="175" y="373" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">/ sentence / slide</text>

  <line x1="270" y1="335" x2="316" y2="335" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Build Retriever -->
  <rect x="320" y="300" width="230" height="70" rx="8" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
  <text x="435" y="326" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#111827">Build Retriever</text>
  <text x="435" y="343" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">bm25 / dense / hybrid / hyde</text>
  <text x="435" y="358" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">via factory (config.retriever_name)</text>

  <!-- provider pills above Build Retriever -->
  <line x1="435" y1="300" x2="435" y2="278" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="325" y="222" width="220" height="52" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.3"/>
  <text x="435" y="240" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" font-weight="600" fill="#065f46">Embedder + LLM client factory</text>
  <text x="435" y="254" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9.5" fill="#065f46">embed: openai / huggingface / ollama</text>
  <text x="435" y="267" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9.5" fill="#065f46">llm: openai / anthropic / google / ollama</text>

  <!-- chroma below Build Retriever -->
  <line x1="435" y1="370" x2="435" y2="404" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="335" y="406" width="200" height="42" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
  <text x="435" y="424" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" font-weight="600" fill="#9a3412">chromadb vector store</text>
  <text x="435" y="438" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9.5" fill="#9a3412">dense / hybrid / hyde only</text>

  <!-- optional reranker wrap -->
  <rect x="565" y="292" width="140" height="86" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="635" y="308" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#5b21b6">optional</text>
  <text x="635" y="332" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" font-weight="600" fill="#5b21b6">Reranker</text>
  <text x="635" y="348" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9.5" fill="#5b21b6">cross-encoder</text>
  <text x="635" y="362" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9.5" fill="#5b21b6">wraps ANY retriever</text>

  <line x1="550" y1="335" x2="561" y2="335" stroke="#374151" stroke-width="1.5"/>
  <line x1="709" y1="335" x2="746" y2="335" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Query loop -->
  <rect x="750" y="300" width="200" height="70" rx="8" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
  <text x="850" y="326" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#111827">Per-query loop</text>
  <text x="850" y="343" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">retrieve() -&gt; evaluate</text>
  <text x="850" y="358" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">recall / mrr / ndcg / latency / cost</text>

  <line x1="950" y1="335" x2="996" y2="335" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Aggregate -->
  <rect x="1000" y="300" width="140" height="70" rx="8" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
  <text x="1070" y="326" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#111827">Aggregate</text>
  <text x="1070" y="343" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">mean metrics,</text>
  <text x="1070" y="358" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">p50/p95/p99, cost</text>

  <!-- exit boundary -->
  <line x1="1070" y1="370" x2="1070" y2="600" stroke="#374151" stroke-width="1.5"/>
  <line x1="1070" y1="600" x2="565" y2="600" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="820" y="592" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#b91c1c">RunResult JSON via stdout (a crash here -&gt; caller gets a failed=True result, not a lost process)</text>

  <!-- Result -->
  <rect x="365" y="626" width="220" height="54" rx="8" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
  <text x="475" y="649" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#111827">RunResult(s)</text>
  <text x="475" y="666" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#4b5563">accuracy, latency, cost, errors</text>

  <line x1="425" y1="680" x2="290" y2="726" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="525" y1="680" x2="660" y2="726" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="728" width="220" height="42" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.3"/>
  <text x="200" y="753" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#1e1b4b">CLI: table + JSON/CSV</text>

  <rect x="640" y="728" width="220" height="42" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.3"/>
  <text x="750" y="753" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#1e1b4b">Python: returned object</text>
</svg>
